[package]
name = "fwok-game"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["lua-editor"]
dylib-engine = ["fyrox/dylib"]
lua-editor = ["lua-plugin/editor", "lua-plugin/package"]
lua-package = ["lua-plugin/package"]
lua-benchmark = ["lua-plugin/benchmark"]

[dependencies]
fyrox.workspace = true
lua-plugin = { workspace = true, default-features = false, features = ["lua54"] }
mlua.workspace = true
serde.workspace = true
toml = "0.9"
