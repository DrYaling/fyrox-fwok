[package]
name = "game_dylib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
fwok-game = { path = "../game", default-features = false }
fyrox.workspace = true

[features]
default = ["lua-editor"]
dylib-engine = ["fwok-game/dylib-engine"]
lua-editor = ["fwok-game/lua-editor"]
lua-package = ["fwok-game/lua-package"]
