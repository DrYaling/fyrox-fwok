# Policy input for the planned lua-tool classify/generate pipeline.
# This file is declarative metadata; the current legacy generator does not
# consume it yet. Do not interpret an allowlist entry as runtime support until
# its generated wrapper and behavior tests are verified.
schema = 1
engine_crates = [
  "fyrox-core",
  "fyrox-math",
  "fyrox-graph",
  "fyrox-ui",
  "fyrox-resource",
  "fyrox-impl",
  "fyrox-animation",
  "fyrox-sound",
]

[defaults]
status = "discovered"
allow_public_fields = false
allow_unsafe = false
allow_borrowed_returns = false
allow_trait_objects = false
threading = "main_thread"

[profiles.value]
allow_kinds = ["struct", "enum"]
ownership = "owned_userdata"
fields = "copy_or_explicit_accessor"

[profiles.handle]
allow_kinds = ["handle", "resource"]
ownership = "validated_token"
requires = ["domain", "epoch", "generation", "capability"]

[profiles.adapter]
allow_kinds = ["scene", "ui", "resource", "animation", "audio", "physics"]
ownership = "host_adapter"
write_strategy = "command_or_message"

[[allowlist]]
rust_path = "fyrox::core::algebra::Vector3<f32>"
lua_path = "fyrox.core.Vector3"
profile = "value"
status = "approved"
tests = ["value.vector3.roundtrip", "value.vector3.invalid_number"]

[[allowlist]]
rust_path = "fyrox::scene::transform::Transform"
lua_path = "fyrox.scene.Transform"
profile = "adapter"
status = "classified"
tests = ["scene.transform.command_applied", "scene.transform.stale_epoch"]

[[denylist]]
pattern = "**::RenderPass*"
reason = "backend-owned rendering context; requires a dedicated adapter"

[[denylist]]
pattern = "**::*Guard"
reason = "lock guard cannot cross the Lua boundary"
