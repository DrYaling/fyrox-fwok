[package]
name = "lua-plugin"
version = "0.1.0"
edition = "2021"
[lib]
name = "lua_plugin"
[features]
default = ["lua54", "package"]
lua54 = ["mlua/lua54"]
luajit = ["mlua/luajit"]
editor = []
package = []
[dependencies]
fyrox.workspace = true
mlua = { version = "0.12.1", features = ["vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
log = "0.4"
