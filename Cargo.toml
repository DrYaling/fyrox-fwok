[workspace]
members = ["lua-binding", "game", "game-dylib", "executor"]
resolver = "2"
[workspace.dependencies]
fyrox = { path = "../Fyrox/fyrox", version = "2.0.0-rc.1" }
lua-binding = { path = "lua-binding" }
mlua = { version = "0.12.1", features = ["vendored", "lua54"] }
[profile.dev.package."*"]
opt-level = 3
[profile.dev-hot-reload]
inherits = "dev"
[profile.release-hot-reload]
inherits = "release"
